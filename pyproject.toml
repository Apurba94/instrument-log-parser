[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "instrument-log-parser"
version = "0.1.0"
description = "Parse raw instrument log files into tidy CSV using configurable regex rules."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "JANIN A APURBA", email = "japurba97@gmail.com"}]
keywords = ["research", "automation", "reproducibility", "academic"]
dependencies = []

[project.scripts]
instrument-log-parser = "instrument_log_parser.cli:main"

[tool.setuptools]
packages = ["instrument_log_parser"]
